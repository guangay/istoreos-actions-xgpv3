name: Build iStore OS 24.10

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP'
        default: '10.10.10.1.1'
        required: true
      os_name:
        description: '系统名称'
        default: 'iStore OS'
        required: true
      enable_wifi:
        description: '启用 WiFi (true/false)'
        default: 'false'
        required: true
  schedule:
    - cron: '0 17 * * 1'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  ARCHITECTURE: rk35xx-24.10
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: 准备完成
        uses: actions/checkout@main

      - name: 检查服务器配置
        run: |
          echo "若分配的服务器性能不足，务必及时取消，重新运行！"
          echo "------------------------------- CPU信息 -------------------------------"
          echo "CPU物理数量:$(cat /proc/cpuinfo| grep 'physical id'| sort| uniq| wc -l)"
          echo "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c)"
          echo "------------------------------- 内存信息 -------------------------------"
          echo "已安装内存详细信息:"
          sudo lshw -short -C memory | grep GiB
          echo "------------------------------- 磁盘信息 -------------------------------"
          df -Th

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "------------------------------- 更新并安装依赖 -------------------------------"
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/ubuntu)
          wget https://bootstrap.pypa.io/pip/3.6/get-pip.py
          sudo python3 get-pip.py
          sudo rm -rf get-pip.py
          sudo pip install pyelftools
          echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
          docker rmi `docker images -q` 2>/dev/null || true
          docker image prune -a -f 2>/dev/null || true
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* 2>/dev/null || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          echo "------------------------------- 设置工作目录及时区 -------------------------------"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir

      - name: 克隆源码
        working-directory: /mnt/workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 缓存构建动作
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mix-key: ${{ env.ARCHITECTURE }}
          prefix: ${{ github.workspace }}/openwrt

      - name: 加载自定义 feeds
        env:
          FEEDS_CONF_PATH: ${{ env.ARCHITECTURE }}/${{ env.FEEDS_CONF }}
        run: |
          [ -e $FEEDS_CONF_PATH ] && cp $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
          chmod +x $DIY_P1_SH
          cd openwrt
          bash $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 加载自定义配置
        env:
          CONFIG_FILE_PATH: ${{ env.ARCHITECTURE }}/${{ env.CONFIG_FILE }}
        run: |
          [ -e files ] && cp -r files openwrt/files
          [ -e $CONFIG_FILE_PATH ] && cp $CONFIG_FILE_PATH openwrt/$CONFIG_FILE
          chmod +x $DIY_P2_SH
          cd openwrt
          bash $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 设置 LAN IP 地址
        run: |
          cd openwrt
          sed -i "s/192.168.100.1/${{ inputs.lan_ip }}/g" package/base-files/files/bin/config_generate

      - name: 设置系统名称
        run: |
          cd openwrt
          sed -i "s/iStore OS/${{ inputs.os_name }}/g" package/base-files/files/bin/config_generate

      - name: 下载软件包
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "使用 $(n proc) 线程编译"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "STATUS=success" >> $GITHUB_ENV

      - name: 检查磁盘空间
        if: success() || failure()
        run: df -hT

      - name: 整理固件文件
        id: organize
        if: env.STATUS == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 上传固件
        if: env.STATUS == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_${{ env.ARCHITECTURE }}_$(date +'%Y%m%d%H%M')
          path: ${{ env.FIRMWARE }}
          retention-days: 7

      - name: 创建 GitHub Release
        if: env.STATUS == 'success'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: istoreos-${{ env.ARCHITECTURE }}-$(date +'%Y%m%d')
          name: iStoreOS ${{ env.ARCHITECTURE }} $(date +'%Y-%m-%d')
          body: |
            ## iStoreOS ${{ env.ARCHITECTURE }} 每周自动构建版本

            **编译时间**: $(date +'%Y-%m-%d %H:%M:%S')

            **设备**: xiguapi-v3 (RK3568)

            **版本**: 24.10

            ### 包含驱动
            - QModem 5G模组管理
            - xgp-v3 屏幕驱动

            ### 固件说明
            - 自动编译，仅供测试使用
          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传固件到 Release
        if: env.STATUS == 'success' && steps.create_release.outputs.id != ''
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.FIRMWARE }}/*
          asset_name: firmware_$(date +'%Y%m%d').zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
