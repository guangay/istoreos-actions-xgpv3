name: Build iStore OS 24.10

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP地址'
        required: false
        default: '192.168.10.1'
      os_name:
        description: '系统名称'
        required: false
        default: 'iStore OS'
      enable_wifi:
        description: '启用WiFi'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  ARCHITECTURE: rk35xx-24.10
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P2_SH: rk35xx-24.10/diy-part2.sh
  DEBIAN_FRONTEND: noninteractive
  TZ: Asia/Shanghaijobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: 初始化编译环境
        run: |
          echo "------------------------------- 更新并安装依赖 -------------------------------"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/ubuntu-24.04)
          sudo python3 -m pip install --break-system-packages pyelftools
          
          echo "------------------------------- 清理磁盘空间 -------------------------------"
          docker images -q | xargs -r docker rmi 2>/dev/null || true
          docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/android /opt/ghc
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          
          echo "------------------------------- 设置工作目录及时区 -------------------------------"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          path: istoreos-actions

      - name: 克隆源码
        working-directory: /mnt/workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 加载自定义 feeds
        run: |
          cd $GITHUB_WORKSPACE/istoreos-actions
          [ -e $ARCHITECTURE/$FEEDS_CONF ] && cp $ARCHITECTURE/$FEEDS_CONF $GITHUB_WORKSPACE/openwrt/$FEEDS_CONF
          cd $GITHUB_WORKSPACE/openwrt

      - name: 更新 feeds
        run: cd $GITHUB_WORKSPACE/openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd $GITHUB_WORKSPACE/openwrt && ./scripts/feeds install -a

      - name: 加载自定义配置
        run: |
          cd $GITHUB_WORKSPACE/istoreos-actions
          [ -e files ] && cp -r files $GITHUB_WORKSPACE/openwrt/
          [ -e $ARCHITECTURE/$CONFIG_FILE ] && cp $ARCHITECTURE/$CONFIG_FILE $GITHUB_WORKSPACE/openwrt/$CONFIG_FILE
          chmod +x $GITHUB_WORKSPACE/istoreos-actions/$DIY_P2_SH
          cd $GITHUB_WORKSPACE/openwrt
          $GITHUB_WORKSPACE/istoreos-actions/$DIY_P2_SH $REPO_BRANCH $ARCHITECTURE

      - name: 设置LAN IP地址
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          SET_IP="${{ github.event.inputs.lan_ip }}"
          [ -z "$SET_IP" ] && SET_IP="192.168.10.1"
          sed -i "s/192\.[0-9]*\.[0-9]*/$SET_IP/g" package/base-files/files/bin/config_generate

      - name: 设置系统名称
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          set_os_name="${{ github.event.inputs.os_name }}"
          [ -z "$set_os_name" ] && set_os_name="iStore OS"
          sed -i "s/OpenWrt/${set_os_name}/g" package/base-files/files/bin/config_generate

      - name: 下载软件包
        id: package
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd $GITHUB_WORKSPACE/openwrt
          echo "开始编译，使用 $(nproc) 核心"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 整理固件文件
        run: |
          cd $GITHUB_WORKSPACE/openwrt/bin/targets/*/*
          rm -rf packages
          echo "固件目录: $PWD"

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgpv3-固件
          path: |
            /mnt/workdir/openwrt/bin/targets/**/*.img.gz
            /mnt/workdir/openwrt/bin/targets/**/*.tar.gz
          retention-days: 7
