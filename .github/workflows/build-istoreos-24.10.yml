# ============================================
# iStoreOS 24.10 RK3568 构建 Workflow
# 目标设备: nlnet_xiguapi-v3
# ============================================

name: Build iStoreOS 24.10 (RK3568)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP 地址'
        required: false
        default: '10.10.10.1.1'
        type: string
      os_name:
        description: '系统名称'
        required: false
        default: 'iStore OS'
        type: string
      enable_wifi:
        description: '启用 WiFi'
        required: false
        default: 'false'
        type: boolean
    secrets:
      GITHUB_TOKEN:
        required: false

  # 定时触发：每周一 17:00
  schedule:
    - cron: '0 17 * * 1'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  ARCHITECTURE: rk35xx-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # ============================================
      # 1. 环境初始化
      # ============================================
      - name: 设置时区
        run: sudo timedatectl set-timezone $TZ

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            clang \
            flex \
            g++ \
            gcc \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            swig \
            bc \
            bison \
            autoconf \
            ccache \
            file \
            time \
            meson

      # ============================================
      # 2. 克隆源码
      # ============================================
      - name: 克隆 iStoreOS 源码
        uses: actions/checkout@v4
        with:
          path: istoreos
          fetch-depth: 1
          sparse-checkout: |
            .github
            Makefile
            target
            package
            scripts
            tools
            config
            include
            dl
            feeds
          sparse-checkout-cone-mode: false

      - name: 克隆完整仓库
        run: |
          cd istoreos
          git init
          git remote add origin ${{ env.REPO_URL }}
          git fetch origin ${{ env.REPO_BRANCH }}
          git checkout -b ${{ env.REPO_BRANCH }} origin/${{ env.REPO_BRANCH }}

      # ============================================
      # 3. 构建缓存
      # ============================================
      - name: 缓存构建目录
        id: cache-build
        uses: klever1988/cachewrtbuild@v1.2.3
        with:
          enable_cross_compile: true
          arch: armvirt
          device: ${{ env.ARCHITECTURE }}

      - name: 恢复缓存
        if: steps.cache-build.outputs.cache-hit == 'true'
        run: |
          echo "从缓存恢复构建目录..."
          cd istoreos
          tar -xzf /tmp/rk35xx-24.10.tar.gz

      # ============================================
      # 4. Feeds 配置
      # ============================================
      - name: 初始化 feeds
        run: |
          cd istoreos
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================
      # 5. 加载默认配置
      # ============================================
      - name: 加载默认配置
        run: |
          cd istoreos
          make defconfig
          cat .config | head -30

      # ============================================
      # 6. 自定义配置
      # ============================================
      - name: 配置目标设备
        run: |
          cd istoreos
          
          # 启用目标设备
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y" >> .config
          
          # 禁用 ALL_PROFILES 以只编译目标设备
          echo "# CONFIG_TARGET_ALL_PROFILES is not set" >> .config
          
          # 清理重复的设备配置
          grep -v "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_" .config > .config.tmp || true
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_nlnet_xiguapi-v3=y" >> .config.tmp
          mv .config.tmp .config

      - name: 配置 LAN IP
        if: github.event.inputs.lan_ip != ''
        run: |
          cd istoreos
          echo "配置 LAN IP: ${{ github.event.inputs.lan_ip }}"
          sed -i "s/CONFIG_LAN_IPADDR=.*/CONFIG_LAN_IPADDR='${{ github.event.inputs.lan_ip }}'/g" .config

      - name: 配置系统名称
        if: github.event.inputs.os_name != ''
        run: |
          cd istoreos
          echo "配置系统名称: ${{ github.event.inputs.os_name }}"
          sed -i "s/CONFIG_IB_DISTRIBUTOR=.*/CONFIG_IB_DISTRIBUTOR='${{ github.event.inputs.os_name }}'/g" .config

      - name: 启用 WiFi
        if: github.event.inputs.enable_wifi == 'true'
        run: |
          cd istoreos
          echo "启用 WiFi 支持..."
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603e=y" >> .config

      # ============================================
      # 7. 下载软件包
      # ============================================
      - name: 下载软件包
        run: |
          cd istoreos
          make download -j$(nproc)
          
          # 清理不完整的下载
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      # ============================================
      # 8. 编译固件
      # ============================================
      - name: 编译固件
        run: |
          cd istoreos
          
          # 清理旧的构建产物
          rm -rf bin build_dir
            
          # 首次尝试：使用所有核心并行编译
          make -j$(nproc) V=s
          
          BUILD_STATUS=$?
          
          # 如果失败，尝试减少并行数
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "并行编译失败，尝试减少并行数..."
            make -j4 V=s
          fi
          
          # 如果仍然失败，使用单线程编译（显示详细日志）
          if [ $? -ne 0 ]; then
            echo "仍失败，使用单线程编译..."
            make -j1 V=s
          fi

      # ============================================
      # 9. 整理产物
      # ============================================
      - name: 整理构建产物
        run: |
          cd istoreos
          
          # 创建输出目录
          mkdir -p output
          
          # 查找固件文件
          find bin -name "*.bin" -o -name "*.img" -o -name "*.tar.gz" 2>/dev/null | while read f; do
            cp "$f" output/
            echo "找到固件: $f"
          done
          
          # 显示产物信息
          ls -lh output/ || echo "无固件产物"

      # ============================================
      # 10. 保存缓存
      # ============================================
      - name: 保存构建缓存
        if: success()
        run: |
          cd istoreos
          tar -czf /tmp/rk35xx-24.10.tar.gz bin/ build_dir/ 2>/dev/null || true

      # ============================================
      # 11. 上传产物
      # ============================================
      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: istoreos-${{ env.ARCHITECTURE }}-${{ github.run_number }}
          path: |
            istoreos/output/*.bin
            istoreos/output/*.img
            istoreos/output/*.tar.gz
          retention-days: 30

      # ============================================
      # 12. 创建 Release
      # ============================================
      - name: 创建 Release
        if: success() && github.event_name == 'schedule'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: istoreos-${{ env.ARCHITECTURE }}-${{ github.run_number }}
          name: iStoreOS ${{ env.ARCHITECTURE }} Build #${{ github.run_number }}
          body: |
            自动构建版本
            - 触发时间: ${{ github.event.schedule }}
            - 运行编号: #${{ github.run_number }}
            - 设备: nlnet_xiguapi-v3
          files: |
            istoreos/output/*.bin
            istoreos/output/*.img
            istoreos/output/*.tar.gz
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # 13. 清理磁盘空间
      # ============================================
      - name: 清理磁盘空间
        if: always()
        run: |
          sudo docker system prune -af || true
          sudo apt-get clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* 2>/dev/null || true
