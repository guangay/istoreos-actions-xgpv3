name: Build iStoreOS 24.10 (RK3568)

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP'
        default: '192.168.10.1'
        required: true
      os_name:
        description: '系统名称'
        default: 'iStore OS'
        required: true
      enable_wifi:
        description: '启用 WiFi'
        default: 'false'
        required: true
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  ARCHITECTURE: rk35xx-24.10
  DEVICE_NAME: nlnet_xiguapi-v3
  DEVICE_TREE: rk3568-xiguapi-v3.dts
  CONFIG_REPO: https://github.com/guangay/istoreos-actions-xgpv3.git
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: 准备完成
        uses: actions/checkout@v4

      - name: 检查服务器配置
        run: |
          echo "若分配的服务器性能不足，务必及时取消，重新运行！"
          echo "------------------------------- CPU信息 -------------------------------"
          echo "CPU物理数量:$(cat /proc/cpuinfo| grep 'physical id'| sort| uniq| wc -l)"
          echo "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c)"
          echo "------------------------------- 内存信息 -------------------------------"
          echo "已安装内存详细信息:"
          sudo lshw -short -C memory | grep GiB
          echo "------------------------------- 磁盘信息 -------------------------------"
          df -Th

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          # 安装编译依赖 (ubuntu-24.04)
          sudo -E apt-get -qq install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev rsync unzip zlib1g-dev swig libpython3-dev \
            python3 python3-pip python3-venv python3-dev aria2 jq subversion qemu-utils \
            ccache rename libelf-dev libgmp-dev libmpc-dev libmpfr-dev
          # 安装 pip 包
          pip3 install --user pyelftools pysocks unidecode requests || true
          sudo docker rmi `docker images -q` || true
          sudo docker image prune -a -f || true
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆源码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 克隆配置仓库
        run: |
          rm -rf config_temp
          git clone --depth 1 $CONFIG_REPO config_temp
          cp -f config_temp/diy-part1.sh $GITHUB_WORKSPACE/
          cp -f config_temp/diy-part2.sh $GITHUB_WORKSPACE/
          cp -r config_temp/rk35xx-24.10 $GITHUB_WORKSPACE/ 2>/dev/null || true
          # 复制设备树文件
          echo ">>> 开始复制设备树..."
          echo ">>> 源路径: config_temp/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/$DEVICE_TREE"
          if [ -f "config_temp/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/$DEVICE_TREE" ]; then
            mkdir -p $GITHUB_WORKSPACE/openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
            cp -f config_temp/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/$DEVICE_TREE \
                  $GITHUB_WORKSPACE/openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
            echo "✅ 设备树 $DEVICE_TREE 复制成功!"
            ls -la $GITHUB_WORKSPACE/openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/$DEVICE_TREE
          else
            echo "❌ 错误: 设备树文件不存在!"
            ls -la config_temp/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/ 2>/dev/null || echo "目录不存在或为空"
          fi
          rm -rf config_temp

      - name: 缓存构建动作
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: ${{ env.ARCHITECTURE }}-${{ env.REPO_BRANCH }}
          prefix: ${{ github.workspace }}/openwrt

      - name: 加载自定义 feeds
        env:
          FEEDS_CONF_PATH: ${{ env.ARCHITECTURE }}/${{ env.FEEDS_CONF }}
        run: |
          [ -e $FEEDS_CONF_PATH ] && mv $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 克隆 xgp_screen 屏幕驱动
        run: |
          rm -rf xgp-v3-screen
          git clone --depth 1 https://github.com/junhong-l/xgp-v3-screen.git
          mv xgp-v3-screen openwrt/package/xgp-v3-screen
          echo ">>> xgp_screen 屏幕驱动已安装"

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 加载自定义配置
        env:
          CONFIG_FILE_PATH: ${{ env.ARCHITECTURE }}/${{ env.CONFIG_FILE }}
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE_PATH ] && mv $CONFIG_FILE_PATH openwrt/$CONFIG_FILE
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 设置 LAN IP 地址
        run: |
          cd openwrt
          sed -i "s/192.168.100.1/${{ github.event.inputs.lan_ip }}/g" package/base-files/files/bin/config_generate

      - name: 设置系统名称
        run: |
          cd openwrt
          sed -i "s/iStore OS/${{ github.event.inputs.os_name }}/g" package/base-files/files/bin/config_generate

      - name: 启用 WiFi
        if: github.event.inputs.enable_wifi == 'true'
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603e=y" >> .config

      - name: 下载软件包
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "使用 $(nproc) 线程编译"
          make -j$(nproc) && echo "STATUS=success" >> $GITHUB_ENV || make -j1 V=s && echo "STATUS=success" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 检查磁盘空间
        if: success() || failure()
        run: df -hT

      - name: 调试固件目录
        if: always()
        run: |
          echo "=== 调试: 检查编译输出目录 ==="
          ls -la openwrt/bin/ 2>/dev/null || echo "openwrt/bin/ 不存在"
          ls -la openwrt/bin/targets/ 2>/dev/null || echo "openwrt/bin/targets/ 不存在"
          find openwrt/bin/targets -name "*.img" -o -name "*.bin" 2>/dev/null | head -20 || echo "没有找到固件文件"

      - name: 整理固件文件
        id: organize
        if: env.STATUS == 'success'
        run: |
          echo "=== 整理固件文件 ==="
          TARGET_DIR=$(find openwrt/bin/targets -type d -name "targets" -exec find {} -maxdepth 2 -type d \; 2>/dev/null | grep -E "[^/]+/[^/]+$" | head -1)
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: 找不到固件目录!"
            ls -la openwrt/bin/targets/ 2>/dev/null || echo "bin/targets 目录不存在"
            exit 1
          fi
          echo "固件目录: $TARGET_DIR"
          cd "$TARGET_DIR"
          rm -rf packages
          ls -la
          echo "固件文件:"
          find . -type f \( -name "*.img" -o -name "*.bin" -o -name "*.tar.gz" \) -exec ls -lh {} \;

      - name: 保存配置文件
        if: env.STATUS == 'success'
        run: |
          find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d ! -name 'packages' | while read dir; do
            cp openwrt/.config "$dir/.config" 2>/dev/null && echo "已保存 .config 到 $dir"
          done

      - name: 上传固件
        if: env.STATUS == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: |
            openwrt/bin/targets/**/
          retention-days: 30
