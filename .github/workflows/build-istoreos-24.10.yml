name: Build iStoreOS Firmware (XGPV3)

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP'
        default: '192.168.10.1'
        required: true
      os_name:
        description: '系统名称'
        default: 'iStore OS'
        required: true
      enable_wifi:
        description: '启用 WiFi'
        default: 'false'
        required: true
  # schedule:                   # 可选，每日自动构建
  #   - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  DEVICE_NAME: nlnet_xiguapi-v3
  DEVICE_TREE: rk3568-xiguapi-v3.dts
  FEEDS_CONF: feeds.conf
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    steps:
      - name: 检出仓库（包含自定义设备树、脚本、补丁）
        uses: actions/checkout@v4

      # ========== 磁盘空间优化（从LEDE工作流移植） ==========
      - name: 检查构建前空间
        run: |
          df -h
          lsblk
          free -h

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 30720
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 强制清理更多空间
        run: |
          echo "=== 清理前磁盘 ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          sudo docker rmi -f $(docker images -q) 2>/dev/null || true
          sudo apt-get clean
          echo "=== 清理后磁盘 ==="
          df -h
      # ====================================================

      - name: 检查服务器配置
        run: |
          echo "CPU: $(nproc) 核"
          free -h
          df -Th

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev rsync unzip zlib1g-dev swig libpython3-dev \
            python3 python3-pip python3-venv python3-dev aria2 jq subversion qemu-utils \
            ccache rename libelf-dev libgmp-dev libmpc-dev libmpfr-dev patch
          pip3 install --user pyelftools pysocks unidecode requests || true
          sudo docker rmi $(docker images -q) 2>/dev/null || true
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* \
            powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 iStoreOS 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 缓存编译工具链及ccache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: ${{ env.REPO_BRANCH }}-${{ env.DEVICE_NAME }}
          prefix: ${{ github.workspace }}/openwrt

      # ========== 从当前仓库复制自定义文件到 iStoreOS 源码 ==========
      - name: 复制设备树文件
        run: |
          cp ${{ github.workspace }}/target/linux/rockchip/dts/${{ env.DEVICE_TREE }} \
             openwrt/target/linux/rockchip/dts/

      - name: 复制 armv8.mk （包含设备定义）
        run: |
          cp ${{ github.workspace }}/target/linux/rockchip/image/armv8.mk \
             openwrt/target/linux/rockchip/image/

      - name: 复制 feeds 配置并执行 diy-part1
        env:
          FEEDS_CONF_PATH: ${{ env.FEEDS_CONF }}
        run: |
          [ -e "$FEEDS_CONF_PATH" ] && cp "$FEEDS_CONF_PATH" openwrt/feeds.conf
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      # ========== 应用自定义补丁（根目录 + patches目录） ==========
      - name: 应用自定义补丁
        run: |
          cd openwrt
          # 应用仓库根目录下的所有 .patch 文件（例如 999-add-TD-TECH-option-id.patch）
          for patch in $GITHUB_WORKSPACE/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch"
              patch -p1 < "$patch" || true
            fi
          done
          # 兼容旧目录：patches 文件夹下的补丁
          if [ -d "$GITHUB_WORKSPACE/patches" ]; then
            for patch in $GITHUB_WORKSPACE/patches/*.patch; do
              echo "Applying $patch"
              patch -p1 < "$patch" || true
            done
          fi

      - name: 调整 target/linux/rockchip/image/armv8.mk 确保设备启用
        run: |
          cd openwrt
          sed -i '/nlnet_xiguapi-v3/s/^#//' target/linux/rockchip/image/armv8.mk
          if ! grep -q "DEVICE_VARIANT := xiguapi-v3" target/linux/rockchip/image/armv8.mk; then
            sed -i '/define Device\/nlnet_xiguapi-v3/a \  DEVICE_VARIANT := xiguapi-v3' target/linux/rockchip/image/armv8.mk
          fi

      - name: 运行 diy-part2 自定义配置
        run: |
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 生成 .config
        run: cd openwrt && make defconfig

      - name: 修改 LAN IP 地址
        if: github.event.inputs.lan_ip != ''
        run: |
          cd openwrt
          LAN_IP="${{ github.event.inputs.lan_ip }}"
          sed -i "s/192.168.1.1/$LAN_IP/g" package/base-files/files/bin/config_generate

      - name: 修改系统名称
        if: github.event.inputs.os_name != ''
        run: |
          cd openwrt
          OS_NAME="${{ github.event.inputs.os_name }}"
          sed -i "s/OpenWrt/$OS_NAME/g" package/base-files/files/bin/config_generate

      - name: 启用 WiFi（如需）
        if: github.event.inputs.enable_wifi == 'true'
        run: |
          cd openwrt
          echo 'CONFIG_PACKAGE_kmod-mt7915e=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-mt7603e=y' >> .config

      - name: 下载所有软件包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "开始编译，使用 $(nproc) 线程"
          make -j$(nproc) && echo "STATUS=success" >> $GITHUB_ENV || make -j1 V=s && echo "STATUS=success" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 整理固件文件
        if: env.STATUS == 'success'
        run: |
          cd openwrt
          mkdir -p artifacts
          find bin/targets/ -type f \( -name "*.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.tar" \) -exec cp {} artifacts/ \;
          cp .config artifacts/config.seed

      - name: 上传固件工件 (Artifact)
        if: env.STATUS == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/artifacts/
          retention-days: 30

      - name: （可选）发布到 GitHub Release
        if: env.STATUS == 'success' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          files: openwrt/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
