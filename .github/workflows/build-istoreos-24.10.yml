name: Build iStoreOS Firmware (XGPV3)

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP'
        default: '192.168.10.1'
        required: true
      os_name:
        description: '系统名称'
        default: 'iStore OS'
        required: true
      enable_wifi:
        description: '启用 WiFi'
        default: 'false'
        required: true

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  DEVICE_NAME: nlnet_xiguapi-v3
  DEVICE_TREE: rk3568-xiguapi-v3.dts
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  MY_REPO: https://github.com/guangay/istoreos-actions-xgpv3
  MY_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    steps:
      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 30720
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 强制清理更多空间
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/chromium /usr/local/share/powershell
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo docker rmi -f $(docker images -q) 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev rsync unzip zlib1g-dev swig libpython3-dev \
            python3 python3-pip python3-venv python3-dev aria2 jq subversion qemu-utils \
            ccache rename libelf-dev libgmp-dev libmpc-dev libmpfr-dev patch \
            python3-pyelftools python3-setuptools python3-distutils
          pip3 install --user --upgrade pyelftools pysocks unidecode requests || true
          python3 -c "import elftools; print('pyelftools ok')"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 iStoreOS 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 克隆自定义仓库（设备树/补丁/脚本）
        run: |
          git clone $MY_REPO -b $MY_BRANCH ${{ github.workspace }}/myfiles

      - name: 复制设备树文件到内核目录
        run: |
          mkdir -p openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          cp ${{ github.workspace }}/myfiles/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${{ env.DEVICE_TREE }} \
             openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/

      - name: 复制设备树文件到 uboot-rk35xx 目录
        run: |
          mkdir -p openwrt/package/boot/uboot-rk35xx/files/arch/arm/dts/rockchip/
          cp ${{ github.workspace }}/myfiles/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${{ env.DEVICE_TREE }} \
             openwrt/package/boot/uboot-rk35xx/files/arch/arm/dts/rockchip/

      - name: 复制设备树文件到 uboot-rockchip 目录
        run: |
          mkdir -p openwrt/package/boot/uboot-rockchip/files/arch/arm/dts/rockchip/
          cp ${{ github.workspace }}/myfiles/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${{ env.DEVICE_TREE }} \
             openwrt/package/boot/uboot-rockchip/files/arch/arm/dts/rockchip/

      - name: 复制 armv8.mk
        run: |
          cp ${{ github.workspace }}/myfiles/target/linux/rockchip/image/armv8.mk \
             openwrt/target/linux/rockchip/image/

      - name: 应用补丁
        run: |
          cd openwrt
          for patch in ${{ github.workspace }}/myfiles/*.patch; do
            [ -f "$patch" ] && patch -p1 < "$patch" || true
          done

      - name: 添加 QModem feed
        run: |
          cd openwrt
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds update packages

      - name: 安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a

      - name: 调整 armv8.mk
        run: |
          cd openwrt
          sed -i '/nlnet_xiguapi-v3/s/^#//' target/linux/rockchip/image/armv8.mk
          if ! grep -q "DEVICE_VARIANT := xiguapi-v3" target/linux/rockchip/image/armv8.mk; then
            sed -i '/define Device\/nlnet_xiguapi-v3/a \  DEVICE_VARIANT := xiguapi-v3' target/linux/rockchip/image/armv8.mk
          fi

      - name: 运行 diy-part2
        run: |
          chmod +x ${{ github.workspace }}/myfiles/diy-part2.sh
          cd openwrt
          ${{ github.workspace }}/myfiles/diy-part2.sh

      - name: 生成 .config
        run: cd openwrt && make defconfig

      - name: 修改 LAN IP
        if: github.event.inputs.lan_ip != ''
        run: |
          cd openwrt
          sed -i "s/192.168.1.1/${{ github.event.inputs.lan_ip }}/g" package/base-files/files/bin/config_generate

      - name: 修改系统名称
        if: github.event.inputs.os_name != ''
        run: |
          cd openwrt
          sed -i "s/OpenWrt/${{ github.event.inputs.os_name }}/g" package/base-files/files/bin/config_generate

      - name: 启用 WiFi
        if: github.event.inputs.enable_wifi == 'true'
        run: |
          cd openwrt
          echo 'CONFIG_PACKAGE_kmod-mt7915e=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-mt7603e=y' >> .config

      - name: 下载软件包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -delete

      # ==================== 修复后的编译步骤 ====================
      - name: 编译固件（含 U-Boot 设备树修复）
        id: compile
        run: |
          cd openwrt
          # 第一步：单独准备 U-Boot 源码，以便复制缺失的设备树
          echo "准备 U-Boot 源码..."
          make package/boot/uboot-rk35xx/prepare V=s || true
          make package/boot/uboot-rockchip/prepare V=s || true
          
          # 第二步：找到 U-Boot 源码目录并复制设备树
          for uboot_dir in $(find build_dir/target-*/u-boot-* -type d -name "u-boot-*" 2>/dev/null); do
            if [ -d "$uboot_dir" ]; then
              echo "处理 U-Boot 目录: $uboot_dir"
              # 复制设备树到 arch/arm/dts/ 根目录
              cp ${{ github.workspace }}/myfiles/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${{ env.DEVICE_TREE }} \
                 "$uboot_dir/arch/arm/dts/" 2>/dev/null || echo "复制到根目录失败"
              # 复制到 rockchip 子目录（某些 U-Boot 版本需要）
              mkdir -p "$uboot_dir/arch/arm/dts/rockchip"
              cp ${{ github.workspace }}/myfiles/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${{ env.DEVICE_TREE }} \
                 "$uboot_dir/arch/arm/dts/rockchip/" 2>/dev/null || echo "复制到 rockchip 子目录失败"
              # 修复 Makefile：添加设备树到 dtb-y 列表
              sed -i '/^dtb-.*+=/a dtb-$(CONFIG_TARGET_ROCKCHIP_RK3568) += rk3568-xiguapi-v3.dtb' \
                 "$uboot_dir/arch/arm/dts/Makefile" 2>/dev/null || echo "修改 Makefile 失败"
            fi
          done
          
          # 第三步：继续完整编译
          echo "开始完整编译..."
          make -j$(nproc) && echo "STATUS=success" >> $GITHUB_ENV || make -j1 V=s && echo "STATUS=success" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 整理固件
        if: env.STATUS == 'success'
        run: |
          cd openwrt
          mkdir -p artifacts
          find bin/targets/ -type f \( -name "*.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.tar" \) -exec cp {} artifacts/ \;
          cp .config artifacts/config.seed

      - name: 上传固件
        if: env.STATUS == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/artifacts/
          retention-days: 30
