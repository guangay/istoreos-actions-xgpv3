name: Build iStoreOS Firmware

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: 'LAN IP'
        default: '192.168.10.1'
        required: true
      os_name:
        description: '系统名称'
        default: 'iStore OS'
        required: true
      enable_wifi:
        description: '启用 WiFi'
        default: 'false'
        required: true
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  USER_REPO_URL: https://github.com/guangay/istoreos-actions-xgpv3
  DEVICE_NAME: nlnet_xiguapi-v3
  DEVICE_TREE: rk3568-xiguapi-v3.dts
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: 准备完成
        uses: actions/checkout@v4

      - name: 检查服务器配置
        run: |
          echo "若分配的服务器性能不足，务必及时取消，重新运行！"
          echo "------------------------------- CPU信息 -------------------------------"
          echo "CPU物理数量:$(cat /proc/cpuinfo| grep 'physical id'| sort| uniq| wc -l)"
          echo "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c)"
          echo "------------------------------- 内存信息 -------------------------------"
          sudo lshw -short -C memory | grep GiB
          echo "------------------------------- 磁盘信息 -------------------------------"
          df -Th

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理冲突软件
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo docker rmi `docker images -q` || true
          sudo docker image prune -a -f || true

          # 更新软件源和升级
          sudo -E apt-get -qq update
          sudo -E apt-get -qq full-upgrade -y || true
          sudo -E apt-get -qq clean

          # 安装完整编译依赖
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz \
            libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

          pip3 install --user pyelftools pysocks unidecode requests || true

          # 清理不需要的软件
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* \
            powershell openjdk* adoptopenjdk* mysql* php* mongodb* moby* snapd* android* || true
          sudo -E apt-get -qq autoremove --purge

          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆用户仓库
        run: |
          git clone $USER_REPO_URL user-repo
          echo "✅ 用户仓库已克隆"
          ls -la user-repo/

      - name: 克隆源码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 缓存构建
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: ${{ env.REPO_BRANCH }}-${{ env.DEVICE_NAME }}
          prefix: ${{ github.workspace }}/openwrt

      - name: 加载 feeds 配置
        run: |
          cp user-repo/rk35xx-24.10/feeds.conf openwrt/feeds.conf.default
          sed -i '/src-include.*feeds.conf.default/d' openwrt/feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH || true

      - name: 更新 feeds
        run: |
          cd openwrt
          # 清理旧 feeds，强制重新下载
          rm -rf feeds
          ./scripts/feeds update -a
          echo "✅ feeds 已更新"

      - name: 克隆 xgp_screen 屏幕驱动
        run: |
          rm -rf xgp-v3-screen
          git clone --depth 1 https://github.com/junhong-l/xgp-v3-screen.git
          mv xgp-v3-screen openwrt/package/xgp-v3-screen
          echo ">>> xgp_screen 屏幕驱动已安装"

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 加载自定义配置
        run: |
          [ -e user-repo/files ] && cp -r user-repo/files openwrt/files
          [ -e user-repo/rk35xx-24.10/.config ] && cp user-repo/rk35xx-24.10/.config openwrt/.config
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH || true

      - name: 设置 LAN IP 地址
        run: |
          cd openwrt
          sed -i "s/192.168.100.1/${{ github.event.inputs.lan_ip }}/g" package/base-files/files/bin/config_generate

      - name: 设置系统名称
        run: |
          cd openwrt
          sed -i "s/iStore OS/${{ github.event.inputs.os_name }}/g" package/base-files/files/bin/config_generate

      - name: 启用 WiFi
        if: github.event.inputs.enable_wifi == 'true'
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7603e=y" >> .config

      - name: 下载软件包并修复 U-Boot
        id: package
        run: |
          cd openwrt

          echo "=== 检查配置文件 ==="
          if [ ! -f .config ]; then
            echo "❌ 错误: .config 文件不存在!"
            ls -la
            ls -la ../user-repo/rk35xx-24.10/ 2>/dev/null || echo "rk35xx-24.10 目录不存在"
            exit 1
          fi
          echo "✅ .config 存在 ($(wc -l < .config) 行)"

          make defconfig

          # 禁用 uboot-rk35xx
          sed -i 's/^CONFIG_PACKAGE_uboot-rk35xx=y$/# CONFIG_PACKAGE_uboot-rk35xx is not set/' .config
          sed -i '/^CONFIG_PACKAGE_uboot-rk35xx-/s/^/# /' .config
          if ! grep -q "^# CONFIG_PACKAGE_uboot-rk35xx is not set" .config; then
            echo "# CONFIG_PACKAGE_uboot-rk35xx is not set" >> .config
          fi
          echo "CONFIG_PACKAGE_uboot-rk35xx=n" >> .config

          # 启用 uboot-rockchip
          if grep -q "^# CONFIG_PACKAGE_uboot-rockchip is not set" .config 2>/dev/null; then
            sed -i 's/^# CONFIG_PACKAGE_uboot-rockchip is not set/CONFIG_PACKAGE_uboot-rockchip=y/' .config
          elif ! grep -q "^CONFIG_PACKAGE_uboot-rockchip=y" .config 2>/dev/null; then
            echo "CONFIG_PACKAGE_uboot-rockchip=y" >> .config
          fi

          # 启用 easepi-rk3568 variant
          if grep -q "^# CONFIG_PACKAGE_uboot-rockchip-easepi-rk3568 is not set" .config 2>/dev/null; then
            sed -i 's/^# CONFIG_PACKAGE_uboot-rockchip-easepi-rk3568 is not set/CONFIG_PACKAGE_uboot-rockchip-easepi-rk3568=y/' .config
          elif ! grep -q "^CONFIG_PACKAGE_uboot-rockchip-easepi-rk3568=y" .config 2>/dev/null; then
            echo "CONFIG_PACKAGE_uboot-rockchip-easepi-rk3568=y" >> .config
          fi

          echo "✅ U-Boot 配置已修复"

          # 复制设备树文件
          echo "=== 复制设备树文件 ==="
          DTS_SOURCE="${GITHUB_WORKSPACE}/user-repo/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${DEVICE_TREE}"

          if [ -f "$DTS_SOURCE" ]; then
            mkdir -p package/boot/uboot-rockchip/files/arch/arm64/boot/dts/rockchip/
            cp -f "$DTS_SOURCE" package/boot/uboot-rockchip/files/arch/arm64/boot/dts/rockchip/
            echo "============================================"
            echo "✅ 设备树复制成功!"
            echo "============================================"
            echo "源文件: $DTS_SOURCE"
            echo "目标位置: package/boot/uboot-rockchip/files/arch/arm64/boot/dts/rockchip/${DEVICE_TREE}"
            echo "文件大小: $(ls -lh package/boot/uboot-rockchip/files/arch/arm64/boot/dts/rockchip/${DEVICE_TREE} | awk '{print $5}')"
            echo "设备树内容预览:"
            head -20 package/boot/uboot-rockchip/files/arch/arm64/boot/dts/rockchip/${DEVICE_TREE}
            echo "============================================"
          else
            echo "⚠️ 警告: 设备树文件不存在: ${DTS_SOURCE}"
            echo ">>> 搜索设备树文件..."
            find ${GITHUB_WORKSPACE}/user-repo -name "*.dts" -path "*rockchip*" 2>/dev/null | head -10 || echo "没有找到 rockchip 设备树"
            ls -la ${GITHUB_WORKSPACE}/user-repo/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/ 2>/dev/null || echo "设备树目录不存在"
          fi

          echo ">>> 开始下载软件包..."
          make download -j8
          echo ">>> 检查下载失败的文件..."
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "使用 $(nproc) 线程编译"

          echo "=== 最终 U-Boot 配置检查 ==="
          grep -E "uboot-rk35xx|uboot-rockchip" .config || echo "没有找到 U-Boot 配置"

          make -j$(nproc) 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo ""
            echo "============================================"
            echo "❌ 编译失败，exit code: $BUILD_STATUS"
            echo "============================================"
            echo ""
            echo "=== 最后 200 行日志 ==="
            tail -200 build.log
            echo ""
            echo "=== 错误信息提取 ==="
            grep -iE "error:|error |fatal error|make.*\*\*\*|configure.*error" build.log | tail -50 || echo "没有找到明确的错误信息"
            echo ""
            echo "STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi

          echo "✅ 编译成功"
          echo "STATUS=success" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: 检查磁盘空间
        if: success() || failure()
        run: df -hT

      - name: 调试固件目录
        if: always()
        run: |
          echo "=== 调试: 检查编译输出目录 ==="
          ls -la openwrt/bin/ 2>/dev/null || echo "openwrt/bin/ 不存在"
          ls -la openwrt/bin/targets/ 2>/dev/null || echo "openwrt/bin/targets/ 不存在"
          find openwrt/bin/targets -name "*.img" -o -name "*.bin" 2>/dev/null | head -20 || echo "没有找到固件文件"

      - name: 整理固件文件
        id: organize
        if: env.STATUS == 'success'
        run: |
          echo "=== 整理固件文件 ==="
          TARGET_DIR=$(find openwrt/bin/targets -type d -name "targets" -exec find {} -maxdepth 2 -type d \; 2>/dev/null | grep -E "[^/]+/[^/]+$" | head -1)
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: 找不到固件目录!"
            ls -la openwrt/bin/targets/ 2>/dev/null || echo "bin/targets 目录不存在"
            exit 1
          fi
          echo "固件目录: $TARGET_DIR"
          cd "$TARGET_DIR"
          rm -rf packages
          ls -la
          echo "固件文件:"
          find . -type f \( -name "*.img" -o -name "*.bin" -o -name "*.tar.gz" \) -exec ls -lh {} \;

      - name: 保存配置文件
        if: env.STATUS == 'success'
        run: |
          find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d ! -name 'packages' | while read dir; do
            cp openwrt/.config "$dir/.config" 2>/dev/null && echo "已保存 .config 到 $dir"
          done

      - name: 上传固件
        if: env.STATUS == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: |
            openwrt/bin/targets/**
          retention-days: 30
